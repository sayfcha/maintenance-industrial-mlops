[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-industrial-mlops"
version = "0.1.0"
description = "Predictive maintenance ML engineering portfolio"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]
